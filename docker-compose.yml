services:
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: creditguard-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditguard-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped